<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auth test (temporary)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
  fieldset { margin: 0 0 20px; padding: 14px 16px; }
  input { display: block; width: 100%; margin: 6px 0 10px; padding: 8px; box-sizing: border-box; }
  button { padding: 8px 14px; cursor: pointer; }
  pre { background: #f2f2f2; padding: 12px; overflow-x: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Auth test</h1>
<p>Temporary page for checking signup and login. Delete this file when finished.</p>

<fieldset>
  <legend>Sign up</legend>
  <label>Email<input id="su-email" type="email" autocomplete="email"></label>
  <label>Display name<input id="su-name" type="text" autocomplete="nickname"></label>
  <label>Password (8+ characters)<input id="su-pass" type="password" autocomplete="new-password"></label>
  <label><input id="su-artist" type="checkbox" style="display:inline;width:auto"> I want to apply as an artist</label>
  <p><button id="su-btn" type="button">Create account</button></p>
</fieldset>

<fieldset>
  <legend>Log in</legend>
  <label>Email<input id="li-email" type="email" autocomplete="email"></label>
  <label>Password<input id="li-pass" type="password" autocomplete="current-password"></label>
  <p><button id="li-btn" type="button">Log in</button>
     <button id="me-btn" type="button">Who am I?</button>
     <button id="lo-btn" type="button">Log out</button></p>
</fieldset>

<pre id="out">Results appear here.</pre>

<script>
const out = document.getElementById("out");
async function send(url, method, body) {
  try {
    const res = await fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: method === "GET" ? undefined : JSON.stringify(body || {})
    });
    const data = await res.json();
    out.textContent = method + " " + url + " -> " + res.status + "\n" + JSON.stringify(data, null, 2);
  } catch (e) {
    out.textContent = "Request failed: " + e.message;
  }
}
document.getElementById("su-btn").addEventListener("click", function () {
  send("/api/signup", "POST", {
    email: document.getElementById("su-email").value,
    displayName: document.getElementById("su-name").value,
    password: document.getElementById("su-pass").value,
    wantsArtist: document.getElementById("su-artist").checked
  });
});
document.getElementById("li-btn").addEventListener("click", function () {
  send("/api/login", "POST", {
    email: document.getElementById("li-email").value,
    password: document.getElementById("li-pass").value
  });
});
document.getElementById("me-btn").addEventListener("click", function () { send("/api/me", "GET"); });
document.getElementById("lo-btn").addEventListener("click", function () { send("/api/logout", "POST"); });
</script>
</body>
</html>
